        body {

        /* --- Genshin Live Background --- */
        .live-bg {
            position: fixed;
            inset: -50%; /* extend to allow panning */
            z-index: -1;

            background-image:

        @keyframes pulseGlow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }

        .live-bg::before, .live-bg::after {

            position: absolute;
            inset: 0;
            background-image:

        .live-bg::after {

            border-color: #e6c875;

        /* Character Card - Element Dynamic Outlines */
        .char-card {
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            border: 2px solid rgba(var(--elem-rgb), 0.3);
            box-shadow: inset 0 0 15px rgba(var(--elem-rgb), 0.1), 0 5px 15px rgba(0,0,0,0.5);
        }
        
        .char-card::after {
            content: '';
            position: absolute;
            inset: 3px;
            border: 1px solid rgba(var(--elem-rgb), 0.2);
            border-radius: inherit;
            pointer-events: none;
            transition: all 0.4s ease;
            z-index: 20;
        }

        .char-card:hover, .char-card:focus-visible {
            transform: scale(1.05) translateY(-5px);
            box-shadow:

</head>

            emptyState.classList.add('hidden');

            filtered.forEach((char, index) => {
                const bgClass = char.rarity === 5 ? 'bg-5star' : 'bg-4star';
                
                // Convert Hex to RGB for CSS Custom Properties
                const hexToRgb = (hex) => {
                    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                    return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '204, 165, 116';
                };
                
                const card = document.createElement('article');
                card.className = `char-card ${bgClass} rounded-br-[2rem] rounded-tl-lg overflow-hidden cursor-pointer flex flex-col shadow-lg animate-fade-up`;
                card.style.animationDelay = `${index * 0.05}s`;
                card.style.setProperty('--elem-rgb', hexToRgb(char.elementColor));
                card.onclick = () => openModal(char);

                card.innerHTML = `
                    <div class="char-img-container">
                        <i class="fa-solid ${char.elementIcon} absolute top-2 left-2 text-3xl opacity-30 z-10 drop-shadow-md" style="color: ${char.elementColor}"></i>
                        <img src="${char.image}" alt="Portrait of ${char.name}" loading="lazy">
                        <div class="absolute top-2 right-2 flex flex-col items-end gap-[2px] text-gi-goldBright text-[10px] z-10 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">
                            ${Array(char.rarity).fill('<i class="fa-solid fa-star"></i>').join('')}
                        </div>
                    </div>
                    <div class="bg-gi-bgDark/95 border-t-[3px] border-gi-gold py-3 px-2 text-center backdrop-blur-md relative">
                        <h2 class="font-serif font-bold text-gi-parchment text-[15px] tracking-wide truncate drop-shadow-sm">${char.name}</h2>
                        <div class="absolute -top-4 left-1/2 transform -translate-x-1/2 w-8 h-8 rounded-full bg-gi-bgDark border-2 border-gi-gold flex items-center justify-center shadow-md">
                            <i class="fa-solid ${char.elementIcon} text-[14px]" style="color: ${char.elementColor}"></i>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(char) {
            const bgClass = char.rarity === 5 ? 'bg-5star' : 'bg-4star';
            
            // Build Stats Table Rows
            const statsRows = char.stats.map(stat => `
                <tr class="stat-tr border-b border-gi-gold/20 last:border-0 cursor-crosshair">
                    <td class="py-3 px-4 text-gi-textLight/90 font-medium transition-colors">${stat.label}</td>
                    <td class="py-3 px-4 text-right text-gi-parchment font-bold stat-value transition-all duration-300">${stat.value}</td>
                </tr>
            `).join('');

            modalBody.innerHTML = `
                <div class="w-full lg:w-4/12 h-64 lg:h-auto ${bgClass} relative flex items-center justify-center overflow-hidden border-b-2 lg:border-b-0 lg:border-r-2 border-gi-gold/40 shadow-inner">
                    <div class="absolute inset-0 opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMSIvPgo8L3N2Zz4=')]"></div>
                    <i class="fa-solid ${char.elementIcon} absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-[15rem] lg:text-[20rem] opacity-10" style="color: #fff"></i>
                    <img src="${char.image}" alt="${char.name}" class="relative z-10 w-full h-full object-cover lg:object-contain object-[75%_15%] lg:object-center drop-shadow-[0_15px_25px_rgba(0,0,0,0.8)] p-4 lg:p-8">
                    
                    <div class="absolute top-4 left-4 lg:top-8 lg:left-8 z-20">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-full border-2 border-gi-parchment flex items-center justify-center bg-black/50 shadow-lg">
                                <i class="fa-solid ${char.elementIcon} text-2xl" style="color: ${char.elementColor}"></i>
                            </div>
                            <div>
                                <h2 class="text-2xl lg:text-3xl font-serif font-bold text-white tracking-widest drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">${char.name}</h2>
                                <div class="text-gi-goldBright text-sm lg:text-lg mt-1 tracking-widest drop-shadow-md">
                                    ${Array(char.rarity).fill('<i class="fa-solid fa-star"></i>').join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="w-full lg:w-8/12 bg-gi-panel p-6 lg:p-10 lg:overflow-y-auto custom-scrollbar relative flex flex-col justify-center">
                    <div class="absolute top-0 right-0 w-20 h-20 border-t-[3px] border-r-[3px] border-gi-gold/30 m-4 rounded-tr-xl pointer-events-none"></div>
                    <div class="absolute bottom-0 left-0 w-20 h-20 border-b-[3px] border-l-[3px] border-gi-gold/30 m-4 rounded-bl-xl pointer-events-none"></div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 font-sans">
                        
                        <!-- Left Column: Equipment -->
                        <div class="space-y-6">
                            <h3 class="font-serif text-xl text-gi-parchment border-b-[2px] border-gi-gold/50 pb-2 tracking-wide flex items-center gap-2">
                                <i class="fa-solid fa-khanda text-gi-gold"></i> Equipment
                            </h3>
                            <div>
                                <p class="text-gi-gold font-bold text-xs uppercase tracking-widest mb-2 opacity-90"><i class="fa-solid fa-gavel mr-2"></i>Weapons</p>
                                <div class="stat-row p-3 rounded-r-lg mb-2 flex flex-col justify-between gap-1 shadow-md">
                                    <span class="text-gi-textLight font-semibold text-xs">Best in Slot</span>
                                    <span class="text-gi-goldBright font-bold text-sm">${char.bestWeapon}</span>
                                </div>
                                <div class="stat-row p-3 rounded-r-lg flex flex-col justify-between gap-1 shadow-md opacity-90">
                                    <span class="text-gi-textLight font-semibold text-xs">Alternative</span>
                                    <span class="text-gi-parchment font-bold text-sm">${char.altWeapon}</span>
                                </div>
                            </div>
                            
                            <div>
                                <p class="text-gi-gold font-bold text-xs uppercase tracking-widest mb-2 opacity-90"><i class="fa-solid fa-gem mr-2"></i>Artifacts</p>
                                <div class="stat-row p-4 rounded-r-lg shadow-md">
                                    <span class="text-white font-bold text-md tracking-wide">${char.artifactSet}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Right Column: Target Stats & Main Stats -->
                        <div class="space-y-6">
                            <h3 class="font-serif text-xl text-gi-parchment border-b-[2px] border-gi-gold/50 pb-2 tracking-wide flex items-center gap-2">
                                <i class="fa-solid fa-chart-simple text-gi-gold"></i> Sub-Stat Priority
                            </h3>
                            
                            <div class="stats-table-container">
                                <table class="w-full text-left text-sm">
                                    <tbody>
                                        ${statsRows}
                                    </tbody>
                                </table>
                            </div>

                            <div class="grid grid-cols-3 gap-3 mt-4">
                                <div class="bg-black/40 border border-gi-gold/20 p-3 rounded-lg text-center shadow-inner hover:border-gi-gold/60 transition-colors">
                                    <i class="fa-regular fa-hourglass-half text-gi-gold text-lg mb-1"></i>
                                    <p class="text-[9px] text-gi-textLight uppercase tracking-widest mb-1">Sands</p>
                                    <p class="text-xs text-gi-parchment font-bold">${char.sands.split('/')[0].trim()}</p>
                                </div>
                                <div class="bg-black/40 border border-gi-gold/20 p-3 rounded-lg text-center shadow-inner hover:border-gi-gold/60 transition-colors">
                                    <i class="fa-solid fa-wine-glass text-gi-gold text-lg mb-1"></i>
                                    <p class="text-[9px] text-gi-textLight uppercase tracking-widest mb-1">Goblet</p>
                                    <p class="text-xs text-gi-parchment font-bold">${char.goblet.split('/')[0].trim()}</p>
                                </div>
                                <div class="bg-black/40 border border-gi-gold/20 p-3 rounded-lg text-center shadow-inner hover:border-gi-gold/60 transition-colors">
                                    <i class="fa-solid fa-crown text-gi-gold text-lg mb-1"></i>
                                    <p class="text-[9px] text-gi-textLight uppercase tracking-widest mb-1">Circlet</p>
                                    <p class="text-xs text-gi-parchment font-bold">${char.circlet.split('/')[0].trim()}</p>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            `;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderCards();
        });

        filterTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                filterTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.element;
                renderCards();
            });
        });

        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        renderCards();
    </script>
</body>
</html>
