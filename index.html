    <style>
        * {
            -webkit-tap-highlight-color: transparent; /* Removes mobile blue tap flash */
        }
        
        body {
            background-color: transparent;
            color: #e3d8c8;
            overflow-x: hidden;
        }

        /* --- Live Background --- */
        .live-bg {
            position: fixed;
            inset: -50%;
            z-index: -1;
            background-color: #0f111a; 
            background-image: 
                radial-gradient(circle at 25% 40%, rgba(30, 45, 75, 0.6), transparent 40%),
                radial-gradient(circle at 75% 60%, rgba(45, 30, 65, 0.5), transparent 40%),
                radial-gradient(circle at 50% 90%, rgba(20, 35, 55, 0.8), transparent 50%);
            transform: translateZ(0); /* Hardware Acceleration */
        }
        
        @keyframes starFloat { 0% { transform: translateY(0) rotate(0deg) translateZ(0); } 100% { transform: translateY(-500px) rotate(5deg) translateZ(0); } }
        @keyframes pulseGlow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }

        .live-bg::before, .live-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(1.5px 1.5px at 40px 60px, #ffffff, transparent),
                radial-gradient(2px 2px at 150px 100px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 200px, #ffffff, transparent),
                radial-gradient(2.5px 2.5px at 250px 300px, rgba(230,200,117,0.7), transparent);
            background-size: 350px 350px;
            animation: starFloat 120s linear infinite, pulseGlow 7s ease-in-out infinite;
            will-change: transform, opacity; /* Optimizes mobile performance */
        }

        .live-bg::after {
            background-image: 
                radial-gradient(2px 2px at 20px 80px, rgba(0,191,255,0.5), transparent),
                radial-gradient(1.5px 1.5px at 180px 40px, rgba(138,43,226,0.4), transparent),
                radial-gradient(1px 1px at 300px 250px, rgba(255,255,255,0.6), transparent);
            background-size: 450px 450px;
            animation: starFloat 180s linear infinite, pulseGlow 9s ease-in-out infinite alternate;
        }

        .bg-5star { background: linear-gradient(160deg, #d28c46 0%, #b67333 40%, #443c4a 80%, #2a2530 100%); }
        .bg-4star { background: linear-gradient(160deg, #875c98 0%, #684982 40%, #443c4a 80%, #2a2530 100%); }

        .ui-panel {
            background: rgba(59, 66, 85, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); /* Safari support */
            border: 1px solid rgba(230, 200, 117, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0,0,0,0.2);
        }

        .ui-header {
            background: linear-gradient(90deg, rgba(28, 31, 46, 0.95), rgba(59, 66, 85, 0.95));
            border-bottom: 2px solid #cca574;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .filter-tab {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(230, 200, 117, 0.2);
            color: #e3d8c8;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
            padding: 8px 24px;
        }
        .filter-tab:hover, .filter-tab:focus-visible { background: rgba(204, 165, 116, 0.2); border-color: #cca574; transform: translateY(-2px); }
        .filter-tab.active { background: #ece5d8; color: #3b4255; border-color: #e6c875; font-weight: bold; }

        .char-img-container { aspect-ratio: 3/4; width: 100%; overflow: hidden; position: relative; }
        .char-img-container img { width: 100%; height: 100%; object-fit: cover; object-position: 75% 15%; transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); will-change: transform; }

        .char-card {
            /* Changed all to specific properties to prevent layout thrashing */
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.4s ease;
            position: relative;
            border: 2px solid rgba(var(--elem-rgb), 0.3);
            box-shadow: inset 0 0 15px rgba(var(--elem-rgb), 0.1), 0 5px 15px rgba(0,0,0,0.5);
            will-change: transform;
            transform: translateZ(0); /* Hardware acceleration */
        }
        
        .char-card::after {
            content: ''; position: absolute; inset: 3px; border: 1px solid rgba(var(--elem-rgb), 0.2); border-radius: inherit; pointer-events: none; transition: border-color 0.4s ease, inset 0.4s ease; z-index: 20;
        }

        .char-card:hover, .char-card:focus-visible {
            transform: scale(1.05) translateY(-5px) translateZ(0);
            box-shadow: inset 0 0 30px rgba(var(--elem-rgb), 0.4), 0 0 20px rgba(var(--elem-rgb), 0.4), 0 15px 30px rgba(0,0,0,0.7);
            border-color: rgba(var(--elem-rgb), 0.9); z-index: 10;
        }
        
        .char-card:hover::after, .char-card:focus-visible::after { border-color: rgba(var(--elem-rgb), 1); inset: 4px; }
        .char-card:hover .char-img-container img { transform: scale(1.1) translateZ(0); }

                /* --- Minimalist Stripe Nav --- */
        .minimal-nav-container {
            position: relative;
            display: flex;
            justify-content: flex-start; /* Anchors left on mobile so first tabs aren't cut off */
            gap: 0.5rem;
            padding: 1rem 1.5rem 0.5rem 1.5rem; /* Padding replaces margin for flush edge scrolling */
            border-bottom: 2px solid rgba(255,255,255,0.1);
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
            -webkit-overflow-scrolling: touch; /* Momentum scrolling for mobile */
            scroll-behavior: smooth;
        }

        /* Center the strip perfectly on PC */
        @media (min-width: 1024px) {
            .minimal-nav-container {
                justify-content: center;
                gap: 1rem;
                padding: 1.5rem 2rem 0.5rem 2rem;
            }
        }
        
        .minimal-nav-container::-webkit-scrollbar { display: none; }
        
        .minimal-tab {
            position: relative;
            background: transparent;
            border: none;
            color: rgba(227, 216, 200, 0.6);
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.9rem; /* Slightly smaller for mobile optimization */
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            white-space: nowrap;
            outline: none;
            flex-shrink: 0; /* Prevents text/icons from squishing together */
        }

        /* Restore larger tab sizing on PC */
        @media (min-width: 1024px) {
            .minimal-tab {
                font-size: 0.95rem;
                padding: 0.5rem 1rem;
            }
        }

        .minimal-tab:hover {
            color: #fff;
        }

        .minimal-tab.active {
            color: var(--elem-color);
            text-shadow: 0 0 8px rgba(var(--elem-rgb), 0.6);
        }

        .minimal-tab::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--elem-color);
            transform: scaleX(0);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-origin: center;
            box-shadow: 0 -2px 10px var(--elem-color);
            will-change: transform;
        }

        .minimal-tab.active::after {
            transform: scaleX(1);
        }

        /* --- Panel Components --- */
        .modal-panel-content { display: none; animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; will-change: transform, opacity; }
        .modal-panel-content.active { display: block; }

        .stat-row { background: linear-gradient(90deg, rgba(40,46,60,0.9) 0%, rgba(59,66,85,0.4) 100%); transition: transform 0.2s ease, background 0.2s ease; will-change: transform; transform: translateZ(0); }
        .stat-row:hover { transform: translateX(5px) translateZ(0); background: linear-gradient(90deg, rgba(59,66,85,0.9) 0%, rgba(74,83,107,0.4) 100%); }

        .stats-table-container {
            position: relative; overflow: hidden; border-radius: 0.5rem; background: rgba(0,0,0,0.4);
            border: 1px solid rgba(204,165,116,0.3); transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }
        .stats-table-container:hover { border-color: rgba(230,200,117,0.8); box-shadow: 0 0 20px rgba(204,165,116,0.2); }
        
        .stat-tr { transition: transform 0.3s ease; position: relative; z-index: 1; transform: translateZ(0); }
        .stat-tr::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(230,200,117,0.15), transparent); opacity: 0; transition: opacity 0.3s ease; z-index: -1; }
        .stat-tr:hover { transform: scale(1.02) translateZ(0); }
        .stat-tr:hover::before { opacity: 1; }
        .stat-tr:hover td { color: #fff; }
        .stat-tr:hover .stat-value { color: #e6c875; text-shadow: 0 0 10px rgba(230,200,117,0.5); transform: scale(1.05); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cca574; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #e6c875; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar { -webkit-overflow-scrolling: touch; } /* Smooth scroll for inner content */

        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px) translateZ(0); } to { opacity: 1; transform: translateY(0) translateZ(0); } }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(15px) translateZ(0); } to { opacity: 1; transform: translateY(0) translateZ(0); } }
        .animate-fade-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; will-change: transform, opacity; }

        #modal-overlay { opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        #modal-overlay.active { opacity: 1; visibility: visible; }
        #modal-content { transform: scale(0.9) translateY(20px) translateZ(0); opacity: 0; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease; will-change: transform, opacity; }
        #modal-overlay.active #modal-content { transform: scale(1) translateY(0) translateZ(0); opacity: 1; }

        .btn-close { background: #ece5d8; color: #3b4255; border: 2px solid #cca574; transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease; will-change: transform; }
        .btn-close:hover { background: #cca574; color: #fff; transform: scale(1.1) rotate(90deg) translateZ(0); }

</head>

                            <div class="w-12 h-12 rounded-full border-2 border-gi-parchment flex items-center justify-center bg-black/50 shadow-lg">
                                <i class="fa-solid ${char.elementIcon} text-2xl" style="color: ${char.elementColor}"></i>
                            </div>
                            <div>
                                <h2 class="text-2xl lg:text-3xl font-serif font-bold text-white tracking-widest drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">${char.name}</h2>
                                <div class="text-gi-goldBright text-sm lg:text-lg mt-1 tracking-widest drop-shadow-md">
                                    ${Array(char.rarity).fill('<i class="fa-solid fa-star"></i>').join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="w-full lg:w-8/12 bg-gi-panel flex flex-col relative overflow-hidden" style="--elem-color: ${char.elementColor}; --elem-rgb: ${rgbColor}">
                    
                    <div class="absolute top-0 right-0 w-16 h-16 border-t-[3px] border-r-[3px] border-gi-gold/30 m-4 rounded-tr-xl pointer-events-none z-0 hidden lg:block"></div>
                    <div class="absolute bottom-0 right-0 w-16 h-16 border-b-[3px] border-r-[3px] border-gi-gold/30 m-4 rounded-br-xl pointer-events-none z-0 hidden lg:block"></div>

                    <div class="minimal-nav-container">
                        <button class="minimal-tab active" data-target="panel-details"><i class="fa-solid fa-address-card mr-2 opacity-80"></i>Info</button>
                        <button class="minimal-tab" data-target="panel-weapons"><i class="fa-solid fa-khanda mr-2 opacity-80"></i>Weapons</button>
                        <button class="minimal-tab" data-target="panel-artifacts"><i class="fa-solid fa-gem mr-2 opacity-80"></i>Artifacts</button>
                        <button class="minimal-tab" data-target="panel-teams"><i class="fa-solid fa-users mr-2 opacity-80"></i>Teams</button>
                        <button class="minimal-tab" data-target="panel-constellations"><i class="fa-solid fa-star-of-life mr-2 opacity-80"></i>Constellations</button>
                    </div>

                    <div class="flex-grow p-6 lg:p-10 overflow-y-auto custom-scrollbar relative z-10 h-full">
                        
                        <div id="panel-details" class="modal-panel-content active space-y-6">
                            <div class="intro-text-box">
                                <p class="text-gi-textLight text-[14px] leading-relaxed font-sans font-medium tracking-wide">
                                    ${char.introGuide}
                                </p>
                            </div>

                            <div class="flex flex-col gap-1 mb-2">
                                <h3 class="text-xl lg:text-3xl font-serif text-white tracking-wide border-b-[2px] border-gi-gold/50 pb-3">${char.title}</h3>
                            </div>

                            <div class="bg-black/30 p-5 rounded-lg border-l-4 shadow-inner relative overflow-hidden" style="border-color: var(--elem-color)">
                                <i class="fa-solid fa-quote-left absolute top-3 left-3 text-4xl opacity-10" style="color: var(--elem-color)"></i>
                                <p class="text-gi-textLight leading-relaxed text-[14px] lg:text-[15px] italic relative z-10 pl-6 drop-shadow-md">"${char.loreQuote}"</p>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-4 mt-6">
                                <div class="bg-gi-bgDark/50 p-4 rounded-lg border border-gi-gold/10 shadow-inner">
                                    <p class="text-[10px] lg:text-xs text-gi-gold uppercase tracking-widest mb-1 opacity-80">Role Focus</p>
                                    <p class="text-md lg:text-lg font-bold text-gi-parchment">${char.role}</p>
                                </div>
                                <div class="bg-gi-bgDark/50 p-4 rounded-lg border border-gi-gold/10 shadow-inner">
                                    <p class="text-[10px] lg:text-xs text-gi-gold uppercase tracking-widest mb-1 opacity-80">Weapon Type</p>
                                    <p class="text-md lg:text-lg font-bold text-gi-parchment">${char.weaponType}</p>
                                </div>
                            </div>
                        </div>

                        <div id="panel-weapons" class="modal-panel-content space-y-6">
                            <h3 class="font-serif text-2xl text-gi-parchment border-b-[2px] border-gi-gold/50 pb-2 tracking-wide flex items-center gap-3">
                                <i class="fa-solid fa-khanda text-gi-gold"></i> Recommended Weapons
                            </h3>
                            <div class="space-y-4">
                                <div class="stat-row p-5 rounded-r-lg flex items-center gap-4 shadow-md border-l-4" style="border-color: var(--elem-color)">
                                    <div class="w-14 h-14 lg:w-16 lg:h-16 rounded-full border-2 border-dashed border-gi-gold/40 bg-black/50 flex-shrink-0 flex items-center justify-center overflow-hidden">
                                        <i class="fa-solid fa-khanda text-gi-textLight/20 text-xl lg:text-2xl"></i>
                                    </div>
                                    <div class="flex flex-col gap-1">
                                        <span class="text-gi-gold font-bold text-xs uppercase tracking-widest"><i class="fa-solid fa-crown mr-2"></i>Best in Slot</span>
                                        <span class="text-white font-bold text-lg lg:text-xl drop-shadow-md">${char.bestWeapon}</span>
                                    </div>
                                </div>
                                <div class="stat-row p-5 rounded-r-lg flex items-center gap-4 shadow-md opacity-90 mt-4 border-l-4 border-gi-panelLight">
                                    <div class="w-12 h-12 lg:w-14 lg:h-14 rounded-full border-2 border-dashed border-gi-gold/30 bg-black/40 flex-shrink-0 flex items-center justify-center overflow-hidden">
                                        <i class="fa-solid fa-khanda text-gi-textLight/20 text-lg lg:text-xl"></i>
                                    </div>
                                    <div class="flex flex-col gap-1">
                                        <span class="text-gi-textLight font-bold text-xs uppercase tracking-widest"><i class="fa-solid fa-scale-balanced mr-2"></i>Strong Alternatives</span>
                                        <span class="text-gi-parchment font-bold text-md lg:text-lg">${char.altWeapon}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="panel-artifacts" class="modal-panel-content space-y-6">
                            <h3 class="font-serif text-2xl text-gi-parchment border-b-[2px] border-gi-gold/50 pb-2 tracking-wide flex items-center gap-3">
                                <i class="fa-solid fa-gem text-gi-gold"></i> Artifacts & Priority
                            </h3>
                            
                            <div class="bg-black/30 p-4 rounded-lg border border-gi-gold/20 shadow-inner mb-6">
                                <p class="text-gi-gold font-bold text-[10px] uppercase tracking-widest mb-2 flex items-center gap-2"><i class="fa-solid fa-book-journal-whills"></i> Talent Level-Up Priority</p>
                                <div class="flex flex-wrap items-center gap-2 text-gi-parchment text-xs sm:text-sm font-bold">
                                    ${talentPriorityHtml}
                                </div>
                            </div>

                            <div class="space-y-3 mb-6">
                                <div class="stat-row p-4 rounded-r-lg flex items-center gap-4 shadow-md border-l-4" style="border-color: var(--elem-color)">
                                    <div class="w-12 h-12 lg:w-14 lg:h-14 rounded-full border-2 border-dashed border-gi-gold/40 bg-black/50 flex-shrink-0 flex items-center justify-center overflow-hidden">
                                        <i class="fa-solid fa-gem text-gi-textLight/20 text-lg"></i>
                                    </div>
                                    <div class="flex flex-col gap-1">
                                        <span class="text-gi-gold font-bold text-[10px] uppercase tracking-widest block mb-1">Best Artifact Set</span>
                                        <span class="text-white font-bold text-md lg:text-lg tracking-wide drop-shadow-md">${char.artifactSet}</span>
                                    </div>
                                </div>
                                <div class="stat-row p-4 rounded-r-lg flex items-center gap-4 shadow-md opacity-90 border-l-4 border-gi-panelLight">
                                    <div class="w-10 h-10 lg:w-12 lg:h-12 rounded-full border-2 border-dashed border-gi-gold/30 bg-black/40 flex-shrink-0 flex items-center justify-center overflow-hidden">
                                        <i class="fa-solid fa-gem text-gi-textLight/20 text-md"></i>
                                    </div>
                                    <div class="flex flex-col gap-1">
                                        <span class="text-gi-textLight font-bold text-[10px] uppercase tracking-widest block mb-1">Alternative Options</span>
                                        <span class="text-gi-parchment font-bold text-[14px] lg:text-[15px] tracking-wide">${char.altArtifacts}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="grid grid-cols-3 gap-2 sm:gap-3 mb-6">
                                <div class="bg-black/40 border border-gi-gold/20 p-2 sm:p-3 rounded-lg text-center shadow-inner hover:border-gi-gold/60 transition-colors">
                                    <i class="fa-regular fa-hourglass-half text-gi-gold text-sm sm:text-lg mb-1"></i>
                                    <p class="text-[8px] sm:text-[9px] text-gi-textLight uppercase tracking-widest mb-1">Sands</p>
                                    <p class="text-[10px] sm:text-xs text-gi-parchment font-bold leading-tight">${char.sands}</p>
                                </div>
                                <div class="bg-black/40 border border-gi-gold/20 p-2 sm:p-3 rounded-lg text-center shadow-inner hover:border-gi-gold/60 transition-colors">
                                    <i class="fa-solid fa-wine-glass text-gi-gold text-sm sm:text-lg mb-1"></i>
                                    <p class="text-[8px] sm:text-[9px] text-gi-textLight uppercase tracking-widest mb-1">Goblet</p>
                                    <p class="text-[10px] sm:text-xs text-gi-parchment font-bold leading-tight">${char.goblet}</p>
                                </div>
                                <div class="bg-black/40 border border-gi-gold/20 p-2 sm:p-3 rounded-lg text-center shadow-inner hover:border-gi-gold/60 transition-colors">
                                    <i class="fa-solid fa-crown text-gi-gold text-sm sm:text-lg mb-1"></i>
                                    <p class="text-[8px] sm:text-[9px] text-gi-textLight uppercase tracking-widest mb-1">Circlet</p>
                                    <p class="text-[10px] sm:text-xs text-gi-parchment font-bold leading-tight">${char.circlet}</p>
                                </div>
                            </div>

                            <p class="text-gi-gold font-bold text-[10px] uppercase tracking-widest mb-2 opacity-90 border-t border-gi-gold/20 pt-4">Target Sub-Stats</p>
                            <div class="stats-table-container">
                                <table class="w-full text-left text-xs sm:text-sm">
                                    <tbody>${statsRows}</tbody>
                                </table>
                            </div>
                        </div>

                        <div id="panel-teams" class="modal-panel-content space-y-6">
                            <h3 class="font-serif text-2xl text-gi-parchment border-b-[2px] border-gi-gold/50 pb-2 tracking-wide flex items-center gap-3">
                                <i class="fa-solid fa-users text-gi-gold"></i> Best Synergies
                            </h3>
                            <div class="flex flex-col gap-4">
                                ${teamCards}
                            </div>
                        </div>

                        <div id="panel-constellations" class="modal-panel-content h-full">
                            <div class="flex flex-col space-y-6 h-full">
                                <h3 class="font-serif text-2xl text-gi-parchment border-b-[2px] border-gi-gold/50 pb-2 tracking-wide flex items-center gap-3 shrink-0">
                                    <i class="fa-solid fa-star-of-life text-gi-gold"></i> Constellation
                                </h3>
                                <p class="text-gi-gold font-bold text-[10px] lg:text-xs uppercase tracking-widest mb-2"><i class="fa-solid fa-star-of-life mr-1"></i> ${char.constellation}</p>
                                
                                <div class="relative w-full h-48 md:h-64 bg-black/40 rounded-xl border border-gi-gold/20 overflow-hidden shrink-0 shadow-inner group">
                                    <div class="absolute inset-0 opacity-20 transition-opacity duration-500 group-hover:opacity-40" style="background: radial-gradient(circle at 50% 50%, rgba(var(--elem-rgb), 0.8), transparent 70%);"></div>
                                    
                                    <svg class="absolute inset-0 w-full h-full drop-shadow-md" viewBox="0 0 100 100" preserveAspectRatio="none">
                                        <polyline points="15,80 30,35 50,70 70,25 85,60 95,15" fill="none" stroke="rgba(204,165,116,0.4)" stroke-width="0.8" stroke-dasharray="2 2" class="opacity-80"/>
                                    </svg>

                                    <button class="constel-node active absolute w-8 h-8 md:w-10 md:h-10 rounded-full border-2 border-gi-goldBright bg-gi-panel transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center shadow-[0_0_15px_rgba(230,200,117,0.8)] transition-all duration-300 hover:scale-110 z-10 scale-110" style="left: 15%; top: 80%;" data-idx="0">
                                        <span class="text-xs md:text-sm text-gi-parchment font-bold">1</span>
                                    </button>
                                    <button class="constel-node absolute w-8 h-8 md:w-10 md:h-10 rounded-full border-2 border-gi-gold/60 bg-gi-panel transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center shadow-[0_0_10px_rgba(0,0,0,0.5)] transition-all duration-300 hover:border-gi-goldBright hover:scale-110 z-10" style="left: 30%; top: 35%;" data-idx="1">
                                        <span class="text-xs md:text-sm text-gi-parchment font-bold opacity-70">2</span>
                                    </button>
                                    <button class="constel-node absolute w-8 h-8 md:w-10 md:h-10 rounded-full border-2 border-gi-gold/60 bg-gi-panel transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center shadow-[0_0_10px_rgba(0,0,0,0.5)] transition-all duration-300 hover:border-gi-goldBright hover:scale-110 z-10" style="left: 50%; top: 70%;" data-idx="2">
                                        <span class="text-xs md:text-sm text-gi-parchment font-bold opacity-70">3</span>
                                    </button>
                                    <button class="constel-node absolute w-8 h-8 md:w-10 md:h-10 rounded-full border-2 border-gi-gold/60 bg-gi-panel transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center shadow-[0_0_10px_rgba(0,0,0,0.5)] transition-all duration-300 hover:border-gi-goldBright hover:scale-110 z-10" style="left: 70%; top: 25%;" data-idx="3">
                                        <span class="text-xs md:text-sm text-gi-parchment font-bold opacity-70">4</span>
                                    </button>
                                    <button class="constel-node absolute w-8 h-8 md:w-10 md:h-10 rounded-full border-2 border-gi-gold/60 bg-gi-panel transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center shadow-[0_0_10px_rgba(0,0,0,0.5)] transition-all duration-300 hover:border-gi-goldBright hover:scale-110 z-10" style="left: 85%; top: 60%;" data-idx="4">
                                        <span class="text-xs md:text-sm text-gi-parchment font-bold opacity-70">5</span>
                                    </button>
                                    <button class="constel-node absolute w-8 h-8 md:w-10 md:h-10 rounded-full border-2 border-gi-gold/60 bg-gi-panel transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center shadow-[0_0_10px_rgba(0,0,0,0.5)] transition-all duration-300 hover:border-gi-goldBright hover:scale-110 z-10" style="left: 95%; top: 15%;" data-idx="5">
                                        <span class="text-xs md:text-sm text-gi-parchment font-bold opacity-70">6</span>
                                    </button>
                                </div>

                                <div class="bg-black/30 p-5 rounded-lg border-l-4 shadow-inner flex-grow flex flex-col justify-center transition-all duration-300" style="border-color: var(--elem-color)">
                                    <span id="constel-level" class="text-gi-gold font-bold text-xs uppercase tracking-widest mb-2"><i class="fa-solid fa-star-half-stroke mr-1"></i> Constellation 1</span>
                                    <h4 id="constel-title" class="text-lg md:text-xl font-serif text-white mb-3 tracking-wide drop-shadow-md">${char.constellations[0].name}</h4>
                                    <p id="constel-desc" class="text-gi-textLight text-sm md:text-[15px] leading-relaxed font-sans">${char.constellations[0].desc}</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            `;
            
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden'; 

            const tabs = modalBody.querySelectorAll('.minimal-tab');
            const panels = modalBody.querySelectorAll('.modal-panel-content');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    panels.forEach(p => p.classList.remove('active'));
                    
                    tab.classList.add('active');
                    const target = tab.getAttribute('data-target');
                    modalBody.querySelector(`#${target}`).classList.add('active');
                });
            });

            const constelNodes = modalBody.querySelectorAll('.constel-node');
            const constelTitle = modalBody.querySelector('#constel-title');
            const constelDesc = modalBody.querySelector('#constel-desc');
            const constelLevel = modalBody.querySelector('#constel-level');

            constelNodes.forEach(node => {
                node.addEventListener('click', () => {
                    const idx = parseInt(node.getAttribute('data-idx'));
                    
                    constelNodes.forEach(n => {
                        n.classList.remove('active', 'border-gi-goldBright', 'scale-110', 'shadow-[0_0_15px_rgba(230,200,117,0.8)]');
                        n.classList.add('border-gi-gold/60');
                        n.querySelector('span').classList.add('opacity-70');
                    });
                    
                    node.classList.add('active', 'border-gi-goldBright', 'scale-110', 'shadow-[0_0_15px_rgba(230,200,117,0.8)]');
                    node.classList.remove('border-gi-gold/60');
                    node.querySelector('span').classList.remove('opacity-70');

                    constelDesc.style.opacity = 0;
                    constelTitle.style.opacity = 0;
                    
                    setTimeout(() => {
                        constelLevel.innerHTML = `<i class="fa-solid fa-star-half-stroke mr-1"></i> Constellation ${idx + 1}`;
                        constelTitle.innerHTML = char.constellations[idx].name;
                        constelDesc.innerHTML = char.constellations[idx].desc;
                        
                        constelDesc.style.opacity = 1;
                        constelTitle.style.opacity = 1;
                        constelDesc.style.transition = 'opacity 0.3s ease';
                        constelTitle.style.transition = 'opacity 0.3s ease';
                    }, 150);
                });
            });
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderCards();
        });

        filterTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                filterTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.element;
                renderCards();
            });
        });

        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        renderCards();
    </script>
</body>
</html>
